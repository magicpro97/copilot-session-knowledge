[package]
name = "sk"
version = "1.2.0"
edition = "2021"
rust-version = "1.75"
description = "Unified front-door CLI for copilot-session-knowledge tools"
default-run = "sk"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled"] }

[[bin]]
name = "sk"
path = "src/main.rs"
