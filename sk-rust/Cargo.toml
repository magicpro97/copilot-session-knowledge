[package]
name = "sk"
version = "1.2.0"
edition = "2021"
rust-version = "1.75"
description = "Unified front-door CLI for copilot-session-knowledge tools"
default-run = "sk"

# Feature flags for native ports — enable only when the port is ready to land.
[features]
default = ["native-embed", "native-sync", "native-extract"]
native-embed   = ["dep:reqwest", "dep:tokio"]
native-sync    = ["dep:reqwest", "dep:tokio"]
native-watch   = ["dep:notify"]
native-hooks   = []
# Enables SK_MARKERS_DIR env override in markers_dir() for integration tests
# that must not write to the real ~/.copilot/markers/ directory.
# Never enable in production builds.
test-helpers   = []
# Wave-14/16/17/19: hot-path classification/write loop, deterministic relation
# extraction, native residual helpers, and SEMANTIC_PROXIMITY (TF-IDF cosine).
# In scope: knowledge_entries write, ke_fts sync, knowledge_relations for
#   SAME_SESSION, SAME_TOPIC, TAG_OVERLAP, RESOLVED_BY, SEMANTIC_PROXIMITY,
#   backfill_affected_files, infer_task_ids, confidence decay.
# Python `extract-knowledge.py` remains for manual/fallback use but is no
#   longer auto-spawned on the successful native watch path.
native-extract = []
# Issue #744: native code indexer using tree-sitter.
# When enabled, `sk code-index` uses tree-sitter for symbol extraction.
# When disabled, falls back to Python `code-search.py --index`.
native-code-index = [
    "dep:walkdir",
    "dep:tree-sitter",
    "dep:tree-sitter-python",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-javascript",
    "dep:streaming-iterator",
]
# Issue #447 (server core) + #449 (DB layer): Axum HTTP server and r2d2 pool.
# Not enabled by default; activate with --features browse-server.
browse-server  = [
    "dep:axum",
    "dep:tower-http",
    "dep:tracing",
    "dep:r2d2",
    "dep:r2d2_sqlite",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:rand",
    "dep:uuid",
    "dep:dunce",
    "dep:md-5",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/signal",
    "tokio/net",
    "tokio/fs",
    "tokio/process",
]
# Issue #454 (PR-A): async Telegram (and later Discord/Ably/Slack) broker.
# Not enabled by default; activate with --features browse-broker.
browse-broker  = [
    "dep:reqwest",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/signal",
]

[dependencies]
clap      = { version = "4",    features = ["derive"] }
dirs      = "5"
rusqlite  = { version = "0.31", features = ["bundled"] }
serde     = { version = "1",    features = ["derive"] }
serde_json = "1"
sha2      = "0.10"
hmac      = "0.12"

# Always-on — low overhead, used across all native command implementations.
anyhow  = "1"
chrono  = { version = "0.4", features = ["serde"] }
ctrlc   = "3"

# Always-on — low overhead, used across browse importers and other native commands.
regex   = "1"
sha1    = "0.10"

# Optional — tree-sitter code indexer (issue #744).
walkdir                = { version = "2",    optional = true }
tree-sitter            = { version = "0.24", optional = true }
tree-sitter-python     = { version = "0.23", optional = true }
tree-sitter-rust       = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
streaming-iterator     = { version = "0.1",  optional = true }

# Optional — compiled-in only when the matching native-* feature is enabled.
notify  = { version = "7",    optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"], optional = true }
tokio   = { version = "1",    features = ["rt-multi-thread", "macros"], optional = true }

# Optional — browse-server feature (issues #447 + #449).
# tower is provided transitively by axum 0.7.9 (which requires tower 0.5);
# do not add a direct tower dep until needed to avoid duplicate-version splits.
axum        = { version = "0.7", optional = true }
tower-http  = { version = "0.6", features = ["cors", "trace"], optional = true }
tracing     = { version = "0.1", optional = true }
r2d2        = { version = "0.8", optional = true }
r2d2_sqlite = { version = "0.24", optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
tokio-util   = { version = "0.7", optional = true }
rand        = { version = "0.9", optional = true }
uuid        = { version = "1", features = ["v4", "serde"], optional = true }
# dunce avoids \\?\ extended-length prefix leaking into stored paths on Windows.
dunce       = { version = "1", optional = true }
# md-5 is only used by the graph handler (browse-server feature).
md-5        = { version = "0.10", optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
dirs = "5"
rusqlite  = { version = "0.31", features = ["bundled"] }
tower     = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile  = "3"
serial_test = "3"
wiremock  = "0.6"
tokio     = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest   = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[[bin]]
name = "sk"
path = "src/main.rs"

[lib]
name = "sk"
path = "src/lib.rs"

# Optimised release binary: smaller size, thin LTO, stripped symbols.
[profile.release]
opt-level     = "s"
lto           = "thin"
codegen-units = 1
strip         = true
