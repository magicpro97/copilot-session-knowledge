<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Remote Terminal</title>
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #050816;
        color: #e2e8f0;
      }

      header {
        padding: 1rem 1.25rem 0.75rem;
        border-bottom: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(15, 23, 42, 0.92);
        backdrop-filter: blur(12px);
      }

      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.2rem;
      }

      p {
        margin: 0;
      }

      #status {
        margin-top: 0.5rem;
        color: #7dd3fc;
        font-size: 0.92rem;
      }

      #terminal {
        flex: 1;
        padding: 0.75rem;
        min-height: 0;
      }

      footer {
        padding: 0.7rem 1.25rem 1rem;
        font-size: 0.9rem;
        color: #94a3b8;
      }

      .xterm {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Remote Terminal</h1>
      <p>Token-authenticated terminal session powered by node-pty, Socket.IO, and xterm.js.</p>
      <p id="status">Connecting…</p>
    </header>
    <main id="terminal" aria-label="Terminal session"></main>
    <footer>Use the browser like a normal terminal: resize the window, press Ctrl+C, Ctrl+D, and use tab completion.</footer>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/xterm-addon-fit.js"></script>
    <script src="/client.js"></script>
  </body>
</html>
