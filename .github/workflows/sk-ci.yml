name: sk CI

on:
  push:
    branches: [main]
    paths:
      - 'sk-rust/**'
      - 'benchmark.py'
      - 'docs/ARCHITECTURE.md'
      - 'tests/test_py_rust_boundary.py'
      - '.github/workflows/sk-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sk-rust/**'
      - 'benchmark.py'
      - 'docs/ARCHITECTURE.md'
      - 'tests/test_py_rust_boundary.py'
      - '.github/workflows/sk-ci.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-check:
    name: Format check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sk-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sk-rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sk-rust/target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('sk-rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-
      - name: Complexity advisory (Rust Clippy)
        continue-on-error: true
        run: cargo clippy --all-targets -- -W clippy::cognitive_complexity -W clippy::too_many_lines
      - run: cargo clippy -- -D warnings

  startup-benchmark:
    name: Startup benchmark regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sk-rust/target/
          key: ubuntu-latest-cargo-startup-${{ hashFiles('sk-rust/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-startup-
      - name: Restore startup benchmark baseline
        uses: actions/cache@v4
        with:
          path: .benchmarks/sk-startup-baseline.json
          key: ubuntu-latest-sk-startup-baseline-v1
          restore-keys: ubuntu-latest-sk-startup-baseline-
      - name: Benchmark sk startup regression gate
        run: |
          cargo build --release --manifest-path sk-rust/Cargo.toml
          python3 benchmark.py startup --runs 7 --warmups 2 --timeout 10 --baseline-file .benchmarks/sk-startup-baseline.json --regression-threshold 20 -- sk-rust/target/release/sk --help
      - name: Upload startup benchmark baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sk-startup-baseline
          path: .benchmarks/sk-startup-baseline.json
          if-no-files-found: ignore

  dependency-audit:
    name: RustSec dependency audit advisory
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sk-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sk-rust/target/
          key: ubuntu-latest-cargo-audit-${{ hashFiles('sk-rust/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-audit-
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # TODO(issue-269): remove continue-on-error and make this blocking after the RustSec baseline is clean.
      - name: RustSec dependency audit (advisory)
        continue-on-error: true
        run: cargo audit --file Cargo.lock

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sk-rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sk-rust/target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('sk-rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - run: cargo test
      - name: Python/Rust boundary regression
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          bin="sk-rust/target/debug/sk"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            bin="sk-rust/target/debug/sk.exe"
          fi
          python3 tests/test_py_rust_boundary.py --rust-bin "$bin"
