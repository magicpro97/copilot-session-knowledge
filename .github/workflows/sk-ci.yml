name: sk CI

on:
  push:
    branches: [main]
    paths:
      - 'sk-rust/**'
      - 'benchmark.py'
      - '.github/workflows/sk-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sk-rust/**'
      - 'benchmark.py'
      - '.github/workflows/sk-ci.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-check:
    name: Format check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sk-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sk-rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sk-rust/target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('sk-rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-
      - name: Complexity advisory (Rust Clippy)
        continue-on-error: true
        run: cargo clippy --all-targets -- -W clippy::cognitive_complexity -W clippy::too_many_lines
      - run: cargo clippy -- -D warnings

  startup-benchmark:
    name: Startup benchmark advisory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sk-rust/target/
          key: ubuntu-latest-cargo-startup-${{ hashFiles('sk-rust/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-startup-
      - name: Benchmark sk startup (advisory)
        continue-on-error: true
        run: |
          cargo build --release --manifest-path sk-rust/Cargo.toml
          python3 benchmark.py startup --runs 7 --warmups 2 --timeout 10 -- sk-rust/target/release/sk --help

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sk-rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sk-rust/target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('sk-rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - run: cargo test
