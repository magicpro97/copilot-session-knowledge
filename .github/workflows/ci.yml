name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: browse-ui/pnpm-lock.yaml

      - name: Install dev tools
        run: pip install "ruff>=0.5"

      - name: Syntax check
        run: python3 scripts/check_syntax.py

      # Canonical surface inventory: docs/ARCHITECTURE.md#python-lint-surface-inventory
      # Keep this list in sync with hooks/pre-commit and tests/test_quality_gates.py.
      - name: Ruff lint
        run: >
          ruff check
          *.py
          browse/ hooks/ scripts/
          tests/test_platform_compat.py tests/test_binary_install.py tests/test_benchmark.py

      - name: Ruff format check
        run: >
          ruff format --check
          *.py
          browse/ hooks/ scripts/
          tests/test_platform_compat.py tests/test_binary_install.py tests/test_benchmark.py

      - name: Complexity advisory (Ruff C90/PLR)
        continue-on-error: true
        run: >
          ruff check --select C90,PLR0911,PLR0912,PLR0913,PLR0915 --statistics
          *.py
          browse/ hooks/ scripts/

      - name: Complexity gate — scoped test files (WBS-096 blocking)
        run: >
          ruff check --select C90,PLR0911,PLR0912,PLR0913,PLR0915
          tests/test_platform_compat.py tests/test_binary_install.py tests/test_benchmark.py

      - name: Build browse-ui static artifact
        run: |
          cd browse-ui
          pnpm install --frozen-lockfile
          pnpm build

      - name: Run tests
        run: python3 run_all_tests.py

      # Issue #364: startup regression guard using benchmark.py startup.
      # Baseline is cached via actions/cache; first run creates it (rc=0),
      # subsequent runs compare against it and fail on >20% regression.
      - name: Restore startup baseline (sk.py --version)
        uses: actions/cache@v4
        with:
          path: .benchmarks/sk-python-startup-baseline.json
          key: ubuntu-latest-py3.11-sk-python-startup-baseline-v2
          restore-keys: ubuntu-latest-py3.11-sk-python-startup-baseline-v2-

      - name: Startup regression guard (sk.py --version)
        run: >
          python3 benchmark.py startup
          --runs 5 --warmups 1 --timeout 30
          --baseline-file .benchmarks/sk-python-startup-baseline.json
          --regression-threshold 20
          -- python3 sk.py --version

      - name: Upload startup baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sk-python-startup-baseline
          path: .benchmarks/sk-python-startup-baseline.json
          if-no-files-found: ignore

  python-platform-safety:
    name: Python platform safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run platform compatibility tests
        run: python tests/test_platform_compat.py

      - name: Run core security tests
        run: python test_security.py

      - name: Run hook security tests
        run: python tests/test_hook_security.py

  # WBS-091: Windows onboarding smoke — install launcher, verify CRLF, invoke sk.cmd.
  windows-onboarding-smoke:
    name: Windows onboarding smoke (WBS-091)
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sk launcher into isolated temp home
        shell: pwsh
        run: |
          $smokeHome = "$env:RUNNER_TEMP\smoke-home"
          $toolsDir  = "$smokeHome\.copilot\tools"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          # Copy repo into the simulated ~/.copilot/tools so sk.cmd can call sk.py
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE\*" "$toolsDir\"
          # Override USERPROFILE so install.py writes into the isolated home
          $env:USERPROFILE = $smokeHome
          Set-Location $toolsDir
          python install.py --install-sk --quiet
          $skCmd = "$smokeHome\.copilot\bin\sk.cmd"
          if (-not (Test-Path $skCmd)) { throw "sk.cmd not created at $skCmd" }
          Write-Host "OK  sk.cmd installed at $skCmd"

      - name: Verify sk.cmd has CRLF line endings
        shell: pwsh
        run: |
          $skCmd = "$env:RUNNER_TEMP\smoke-home\.copilot\bin\sk.cmd"
          $bytes = [System.IO.File]::ReadAllBytes($skCmd)
          $hasCRLF = $false
          for ($i = 0; $i -lt ($bytes.Length - 1); $i++) {
            if ($bytes[$i] -eq 0x0D -and $bytes[$i + 1] -eq 0x0A) { $hasCRLF = $true; break }
          }
          if (-not $hasCRLF) { throw "FAIL: sk.cmd lacks CRLF line endings" }
          Write-Host "OK  sk.cmd has CRLF line endings"
          # Negative fixture: LF-only bytes must NOT trigger CRLF detection
          $lfOnly = [System.Text.Encoding]::UTF8.GetBytes("@echo off`npython test`n")
          $falsePositive = $false
          for ($i = 0; $i -lt ($lfOnly.Length - 1); $i++) {
            if ($lfOnly[$i] -eq 0x0D -and $lfOnly[$i + 1] -eq 0x0A) { $falsePositive = $true; break }
          }
          if ($falsePositive) { throw "Negative CRLF fixture broken: LF-only bytes reported as CRLF" }
          Write-Host "OK  Negative CRLF fixture verified"

      - name: Invoke sk.cmd --version
        shell: cmd
        run: |
          set "USERPROFILE=%RUNNER_TEMP%\smoke-home"
          "%RUNNER_TEMP%\smoke-home\.copilot\bin\sk.cmd" --version

  remote-terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: remote-terminal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: remote-terminal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint baseline
        run: npm run lint

      - name: Run clean-zone lint gate
        run: npm run lint:clean

      - name: Dependency audit
        run: npm run audit:high

  browse-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: browse-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: browse-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # E2E smoke runs on every push / PR. Visual snapshots remain manual-only.
  #
  # Reason: visual.spec.ts contains screenshot-comparison tests whose pixel
  # output differs between macOS (local) and Linux (CI runners), so they would
  # produce false negatives on every push. The smoke, shortcuts, chat,
  # diagnostics, and broker-mode specs run under the Playwright behavioral
  # project and are stable enough for always-on use.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: browse-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: browse-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E smoke tests
        timeout-minutes: 12
        env:
          DEBUG: pw:api,pw:browser*
        run: >
          pnpm exec playwright test --project=behavioral
          --reporter=list,html
          --max-failures=1
          --global-timeout=900000
          --timeout=60000

      - name: Upload Playwright smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-report
          path: |
            browse-ui/playwright-report/
            browse-ui/test-results/
          retention-days: 30

      - name: Upload Playwright smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-test-results
          path: browse-ui/test-results/
          retention-days: 7
          if-no-files-found: warn

  # Visual E2E remains gated to manual dispatch only.
  #
  # To run visual E2E: trigger this workflow manually via the GitHub Actions UI or
  #   gh workflow run ci.yml
  e2e-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: browse-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: browse-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run visual E2E snapshots
        timeout-minutes: 12
        env:
          DEBUG: pw:api,pw:browser*
        run: >
          pnpm exec playwright test e2e/visual.spec.ts
          --project=visual
          --reporter=list,html
          --max-failures=1
          --global-timeout=900000
          --timeout=60000

      - name: Upload Playwright visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-visual-report
          path: |
            browse-ui/playwright-report/
            browse-ui/test-results/
          retention-days: 30

  # Pairing E2E — Edge desktop + mobile Chrome (#58 acceptance proof).
  #
  # Runs only on manual dispatch to avoid burning CI minutes on every push.
  # This job produces the honest Edge + mobile evidence required to close #58:
  #   - pairing-edge-desktop: Desktop Edge (msedge channel, has BarcodeDetector)
  #   - pairing-mobile-chrome: Pixel 5 emulation (touch viewport, mobile UA)
  #
  # To run:
  #   gh workflow run ci.yml
  # Then inspect the "pairing-e2e" job → "Upload Playwright report" artifact
  # for trace files and screenshot SHA-256 evidence.
  pairing-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: browse-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: browse-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (msedge + chromium)
        # msedge is downloaded from Microsoft CDN by Playwright and works on
        # ubuntu-latest runners. chromium is needed for pairing-mobile-chrome.
        run: npx playwright install msedge chromium --with-deps

      - name: Run pairing E2E — Edge desktop + mobile Chrome
        timeout-minutes: 12
        env:
          DEBUG: pw:api,pw:browser*
        run: >
          pnpm exec playwright test e2e/host-pairing.spec.ts
          --project=pairing-edge-desktop
          --project=pairing-mobile-chrome
          --reporter=list,html
          --max-failures=1
          --global-timeout=900000
          --timeout=60000

      - name: Upload Playwright report (trace + screenshot evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pairing-e2e-report
          path: |
            browse-ui/playwright-report/
            browse-ui/test-results/
          retention-days: 30

  agents-release-hook:
    runs-on: ubuntu-latest
    needs: [quality-gates, python-platform-safety, browse-ui, e2e-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect browse-ui release changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "${AFTER_SHA}")"
          else
            changed_files="$(git diff --name-only "${BEFORE_SHA}" "${AFTER_SHA}")"
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '^(firebase\.json|browse-ui/(src/|public/|scripts/|package\.json$|pnpm-lock\.yaml$|next\.config\.ts$|tsconfig\.json$|postcss\.config\.mjs$|eslint\.config\.mjs$|components\.json$))'; then
            echo "should_dispatch=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip release hook when no browse-ui change landed
        if: steps.changes.outputs.should_dispatch != 'true'
        run: echo "::notice title=Agents hosting hook skipped::No browse-ui changes landed on main."

      - name: Dispatch Linhs_Blog agents release
        if: steps.changes.outputs.should_dispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.LINHS_BLOG_REPO_DISPATCH_TOKEN }}
          TOOLS_SHA: ${{ github.sha }}
          TOOLS_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice title=Agents hosting hook skipped::Set LINHS_BLOG_REPO_DISPATCH_TOKEN to enable push-triggered releases into the external hosting repo."
            exit 0
          fi

          gh api repos/magicpro97/Linhs_Blog/dispatches \
            -f event_type='tools-agents-deploy' \
            -F client_payload[tools_repo]='magicpro97/copilot-session-knowledge' \
            -F client_payload[tools_ref]="$TOOLS_REF" \
            -F client_payload[tools_sha]="$TOOLS_SHA"
